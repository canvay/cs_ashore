<svg xmlns="http://www.w3.org/2000/svg" width="118" height="112" viewBox="28 26 118 112" role="img">
  <title>ForAshore 品牌图标（透明底 · 一大一小双帆笔尖版）</title>
  <desc>透明背景上一大一小两片帆构成钢笔尖：上半留一道上宽下窄的倒梯形导墨缝，缝末端接圆形镂空呼吸孔，孔以下两帆沿中线无缝拼接；下方斜上缘梯形船体与帆底紧密贴合。</desc>
  <!-- 左：小帆（雾蓝）。内边界一条直线从帆顶落到圆孔上缘左侧，凹出孔左半，孔下沿中线拼接 -->
  <path d="M81 34 C66 58 52 81 58 94 L62 116.5 L86 113.62 L86 87 A7 7 0 0 1 83 73.68 Z" fill="#7FA8CC"/>
  <!-- 右：大帆（藏青）。内边界一条直线从帆顶落到圆孔上缘右侧，凹出孔右半，合成整圆空隙 -->
  <path d="M91 26 C108 50 121 82 118 88 L110 110.74 L86 113.62 L86 87 A7 7 0 0 0 89 73.68 Z" fill="#1B365D"/>
  <!-- 船体基座（上缘左低右高斜线，倾斜度调小，帆底沿同一斜率压入贴合） -->
  <path d="M31.5 127.2 Q28 118.9 37 118 L137 106 Q146 105.1 143 113.6 L132 138 L40 138 Z" fill="#1B365D"/>
</svg>
